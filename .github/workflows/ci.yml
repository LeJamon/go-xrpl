name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch so a new push doesn't leave the
# whole matrix running on a stale commit. Pushes to main are never cancelled —
# their runs are the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
      # Tagged integration tests run against PostgreSQL below; keep the tagged
      # package in the static-analysis path as well.
      - name: Vet tag-gated postgres backend
        run: go vet -tags postgres ./storage/relationaldb/postgres/
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-lint
          EVIDENCE_LABEL: lint
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            golangci/golangci-lint-action@v8 version=v2.11.3;
            go vet -tags postgres ./storage/relationaldb/postgres/
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-lint
          path: ${{ runner.temp }}/issue-1908-producer-lint
          if-no-files-found: error

  # Advisory linters (security smells, leaked HTTP bodies, missing request
  # contexts, slice preallocation). The codebase is currently clean against this
  # config, so the job is green. continue-on-error keeps it non-blocking: a new
  # finding shows up on the PR (and goes red here) without gating the merge, to
  # be fixed opportunistically.
  lint-advisory:
    name: Lint (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          args: --config .golangci-warnings.yml
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-lint-advisory
          EVIDENCE_LABEL: lint-advisory
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: golangci/golangci-lint-action@v8 version=v2.11.3 args=--config .golangci-warnings.yml
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-lint-advisory
          path: ${{ runner.temp }}/issue-1908-producer-lint-advisory
          if-no-files-found: error

  generate:
    name: Generate (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cgo: "false"
      - uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Re-run go generate
        run: go generate ./ledger/entry/... ./internal/peermanagement/proto
      - name: Fail on tree diff
        run: |
          if ! git diff --exit-code -- ledger/entry internal/peermanagement/proto/xrpl.pb.go; then
            echo "::error::generated files are out of date."
            echo "Run: go generate ./ledger/entry/... ./internal/peermanagement/proto"
            echo "Then commit the regenerated files."
            exit 1
          fi
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-generate
          EVIDENCE_LABEL: generate
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            go generate ./ledger/entry/... ./internal/peermanagement/proto;
            git diff --exit-code -- ledger/entry internal/peermanagement/proto/xrpl.pb.go
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-generate
          path: ${{ runner.temp }}/issue-1908-producer-generate
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build versioned binary
        run: ./scripts/build.sh
      - name: Verify local build version
        run: |
          expected="$(git describe --tags --always --dirty)"
          ../tmp/goxrpl version |
            grep --fixed-strings --line-regexp "go-xrpl version ${expected}"
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-build
          EVIDENCE_LABEL: build
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: ./scripts/build.sh; ../tmp/goxrpl version | grep --fixed-strings --line-regexp "go-xrpl version $(git describe --tags --always --dirty)"
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-build
          path: ${{ runner.temp }}/issue-1908-producer-build
          if-no-files-found: error

  # 32-bit library word-size guard. go-xrpl's correctness is "produce the same bytes as
  # rippled"; an `int`-width or endianness assumption in the codec / hashing
  # paths silently forks account_hash / transaction_hash. `int` is 64-bit on the
  # amd64 matrix, so an overflow like `len(x) > math.MaxUint32` only fails to
  # compile on a 32-bit target. The daemon requires CGO, so this compiles the
  # protocol and storage libraries for linux/386, then exercises the SQLite
  # pagination boundaries whose correctness depends on runtime int width.
  # Broader runtime 386 library tests run in the nightly workflow.
  build-386:
    name: Test (libraries, linux/386 — word-size guard)
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: "386"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cgo: "false"
      - run: go build ./...
      - run: go test -count=1 -timeout 5m ./storage/relationaldb/sqlite/...
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-build-386
          EVIDENCE_LABEL: build-386
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: GOOS=linux GOARCH=386 CGO_ENABLED=0 go build ./...; GOOS=linux GOARCH=386 CGO_ENABLED=0 go test -count=1 -timeout 5m ./storage/relationaldb/sqlite/...
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-build-386
          path: ${{ runner.temp }}/issue-1908-producer-build-386
          if-no-files-found: error

  postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xrpl
          POSTGRES_PASSWORD: xrpl
          POSTGRES_DB: xrpl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xrpl -d xrpl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run PostgreSQL repository contract tests
        run: go test -race -tags postgres -count=1 -timeout 10m ./storage/relationaldb/postgres/...
        env:
          GOXRPL_TEST_POSTGRES_DSN: postgres://xrpl:xrpl@localhost:5432/xrpl_test?sslmode=disable
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-postgres
          EVIDENCE_LABEL: postgres
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: go test -race -tags postgres -count=1 -timeout 10m ./storage/relationaldb/postgres/...
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-postgres
          path: ${{ runner.temp }}/issue-1908-producer-postgres
          if-no-files-found: error

  test:
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The offer package (crossing-limits tests) submits tens of thousands
          # of offers across many ledger closes — by far the heaviest suite.
          # Give it a dedicated shard so it runs in parallel with the rest, and
          # run it without -race: these are deterministic protocol-logic tests
          # that the detector slowed ~9x (900s -> ~96s) while the engine's
          # concurrency is already exercised under -race by the other shards.
          # (The nightly workflow runs this suite *with* -race, off the hot path.)
          - group: integration-offer
            packages: ./internal/testing/offer/...
            race: ""
          - group: integration
            packages: "$(go list ./internal/testing/... | grep -v '/internal/testing/offer$')"
            race: "-race"
          - group: tx
            packages: ./internal/tx/...
            race: "-race"
          - group: core
            packages: ./internal/ledger/... ./internal/txq/... ./internal/rpc/... ./internal/consensus/... ./internal/peermanagement/... ./internal/manifest/... ./internal/validator/... ./internal/observability/... ./internal/node/... ./internal/cli/... ./internal/replaytool/...
            race: "-race"
          - group: libs
            packages: ./codec/... ./crypto/... ./shamap/... ./storage/... ./keylet/... ./ledger/... ./amendment/... ./drops/... ./protocol/... ./config/... ./version/...
            race: "-race"
    steps:
      - uses: actions/checkout@v5
      - name: Check out rippled v3.2.0 oracle
        if: matrix.group == 'libs'
        uses: actions/checkout@v5
        with:
          repository: XRPLF/rippled
          ref: 3c43f4614f87965298773279ff5b85d4c56c637b
          path: rippled-worktrees/v3.2.0-oracle
      - name: Check out rippled v3.3.0 oracle
        if: matrix.group == 'libs'
        uses: actions/checkout@v5
        with:
          repository: XRPLF/rippled
          ref: 00a178fb92ca49521b937ae1a99d863765ea8a90
          path: rippled-worktrees/v3.3.0-oracle
      - name: Check out rippled v3.4.0 oracle
        if: matrix.group == 'libs'
        uses: actions/checkout@v5
        with:
          repository: XRPLF/rippled
          ref: 4a4fded2eba11427c48ce3f24d9c1aea5e7a9d17
          path: rippled-worktrees/v3.4.0-oracle
      - name: Verify final definitions fixture provenance and regeneration
        if: matrix.group == 'libs'
        run: |
          generator=internal/rpc/testdata/server_definitions_final_oracle.py
          if python3 "$generator" "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/wrong-oracle.json"; then
            echo "::error::definitions generator accepted the wrong oracle"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/wrong-oracle.json"
          python3 "$generator" rippled-worktrees/v3.4.0-oracle --output "$RUNNER_TEMP/server_definitions_final_hashes.json"
          diff -u internal/rpc/testdata/server_definitions_final_hashes.json "$RUNNER_TEMP/server_definitions_final_hashes.json"
      - uses: ./.github/actions/setup
      - run: go test ${{ matrix.race }} -count=1 -timeout 15m ${{ matrix.packages }}
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-test-${{ matrix.group }}
          EVIDENCE_LABEL: test-${{ matrix.group }}
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            go test ${{ matrix.race }} -count=1 -timeout 15m ${{ matrix.packages }}
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-test-${{ matrix.group }}
          path: ${{ runner.temp }}/issue-1908-producer-test-${{ matrix.group }}
          if-no-files-found: error

  test-purego:
    name: Test (libs, CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cgo: "false"
      # Exercises the pure-Go crypto backends that ship in CGO-disabled
      # builds — most importantly secp256k1's decred verify path, which the
      # CGO=1 legs never compile. Asserts it agrees with the libsecp256k1
      # path on signature accept/reject. No -race here: the detector needs
      # cgo, and no CGO dev headers are installed for this leg.
      - run: CGO_ENABLED=0 go test -count=1 -timeout 15m ./crypto/...
      - run: CGO_ENABLED=0 go test -tags mptcrypto -count=1 -timeout 15m ./amendment/... ./crypto/mptcrypto/...
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-test-purego
          EVIDENCE_LABEL: test-purego
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            CGO_ENABLED=0 go test -count=1 -timeout 15m ./crypto/...;
            CGO_ENABLED=0 go test -tags mptcrypto -count=1 -timeout 15m ./amendment/... ./crypto/mptcrypto/...
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-test-purego
          path: ${{ runner.temp }}/issue-1908-producer-test-purego
          if-no-files-found: error

  test-mpt-crypto:
    name: Test (Confidential MPT native backend, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install Conan
        run: pipx install conan==2.18.1
      - name: Build and test native backend
        run: ./scripts/setup-mpt-crypto.sh test ./amendment/... ./crypto/mptcrypto/... ./internal/tx/mpt/... ./internal/testing/mpt/...
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-test-mpt-crypto-${{ matrix.os }}
          EVIDENCE_LABEL: test-mpt-crypto-${{ matrix.os }}
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: ./scripts/setup-mpt-crypto.sh test ./amendment/... ./crypto/mptcrypto/... ./internal/tx/mpt/... ./internal/testing/mpt/...
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-test-mpt-crypto-${{ matrix.os }}
          path: ${{ runner.temp }}/issue-1908-producer-test-mpt-crypto-${{ matrix.os }}
          if-no-files-found: error

  test-repeated:
    name: Test (final focused, repeated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run focused release regressions twice
        run: go test -count=2 -timeout 20m ./codec/binarycodec/definitions ./ledger/entry/schema ./ledger/entry ./internal/rpc
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-test-repeated
          EVIDENCE_LABEL: test-repeated
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: go test -count=2 -timeout 20m ./codec/binarycodec/definitions ./ledger/entry/schema ./ledger/entry ./internal/rpc
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-test-repeated
          path: ${{ runner.temp }}/issue-1908-producer-test-repeated
          if-no-files-found: error

  conformance-final:
    name: Conformance (final 3.4.0 corpus)
    runs-on: ubuntu-latest
    env:
      ORACLE_TAG: 3.4.0
      ORACLE_REPOSITORY: XRPLF/rippled
      ORACLE_COMMIT: 4a4fded2eba11427c48ce3f24d9c1aea5e7a9d17
      # These repository variables are intentionally required. The source is
      # fetched at a full commit; no corpus or recorder is embedded here.
      FINAL_CONFORMANCE_REPOSITORY: ${{ vars.XRPL_FINAL_CONFORMANCE_REPOSITORY }}
      FINAL_CONFORMANCE_COMMIT: ${{ vars.XRPL_FINAL_CONFORMANCE_COMMIT }}
      FINAL_CONFORMANCE_CORPUS: ${{ github.workspace }}/fixtures/rippled-3.4.0-v3
      FINAL_CONFORMANCE_MANIFEST: ${{ github.workspace }}/fixtures/rippled-3.4.0-v3/manifest.json
      EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-conformance-final
    steps:
      - uses: actions/checkout@v5
      - name: Require externally configured final corpus source
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: scripts/acceptance/final-evidence.sh conformance-source
      - name: Check out final corpus at the configured commit
        if: ${{ vars.XRPL_FINAL_CONFORMANCE_REPOSITORY != '' && vars.XRPL_FINAL_CONFORMANCE_COMMIT != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.XRPL_FINAL_CONFORMANCE_REPOSITORY }}
          ref: ${{ vars.XRPL_FINAL_CONFORMANCE_COMMIT }}
          path: fixtures/rippled-3.4.0-v3
          fetch-depth: 1
      - uses: ./.github/actions/setup
        if: always()
        with:
          cgo: "false"
      - name: Replay final corpus against goXRPL
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: scripts/acceptance/final-evidence.sh conformance
      - name: Record producer evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVIDENCE_LABEL: conformance-final
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            actions/checkout@v5 repository=$XRPL_FINAL_CONFORMANCE_REPOSITORY
            ref=$XRPL_FINAL_CONFORMANCE_COMMIT;
            go test -count=1 -timeout 30m -v ./internal/testing/conformance/...
            (requires the pinned final corpus manifest)
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-conformance-final
          path: ${{ runner.temp }}/issue-1908-producer-conformance-final
          if-no-files-found: error

  peer-interop:
    name: Peer interop (rippled 3.3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run live handshake and manifest interop
        run: PEERTLS_DOCKER_INTEROP=1 go test -tags docker -timeout 5m -v -run 'Test(Handshake|Manifest)_Interop_RippledDocker' ./internal/peermanagement/
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-peer-interop
          EVIDENCE_LABEL: peer-interop
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: PEERTLS_DOCKER_INTEROP=1 go test -tags docker -timeout 5m -v -run 'Test(Handshake|Manifest)_Interop_RippledDocker' ./internal/peermanagement/
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-peer-interop
          path: ${{ runner.temp }}/issue-1908-producer-peer-interop
          if-no-files-found: error

  peer-interop-final:
    name: Peer interop (rippled 3.4.0)
    runs-on: ubuntu-latest
    env:
      PEERTLS_DOCKER_INTEROP: "1"
      PEERTLS_LEDGER_NODE_DEPTH_INTEROP: "1"
      PEERTLS_VALIDATOR_LIST_INTEROP: "1"
      PEERTLS_RIPPLED_VERSION: 3.4.0
      PEERTLS_RIPPLED_IMAGE: goxrpl-oracle:3.4.0
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build pinned final oracle image
        run: docker build -t "$PEERTLS_RIPPLED_IMAGE" scripts/peer-interop
      - name: Verify oracle version and source commit
        run: |
          version="$(docker run --rm --entrypoint /usr/bin/xrpld "$PEERTLS_RIPPLED_IMAGE" --version)"
          grep --fixed-strings --line-regexp 'xrpld version 3.4.0' <<<"$version"
          grep --fixed-strings --line-regexp 'Git commit hash: 4a4fded2eba11427c48ce3f24d9c1aea5e7a9d17' <<<"$version"
      - name: Run live final 3.4.0 peer interop
        run: go test -race -tags docker -count=1 -timeout 10m -v -run 'Test(Handshake|Manifest|LedgerNodeDepth|ValidatorListCollection)_Interop_RippledDocker' ./internal/peermanagement/
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-peer-interop-final
          EVIDENCE_LABEL: peer-interop-final
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            docker build -t goxrpl-oracle:3.4.0 scripts/peer-interop;
            docker run --rm --entrypoint /usr/bin/xrpld goxrpl-oracle:3.4.0 --version;
            go test -race -tags docker -count=1 -timeout 10m -v -run 'Test(Handshake|Manifest|LedgerNodeDepth|ValidatorListCollection)_Interop_RippledDocker' ./internal/peermanagement/
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-peer-interop-final
          path: ${{ runner.temp }}/issue-1908-producer-peer-interop-final
          if-no-files-found: error

  consensus-smoke:
    name: Consensus smoke (rippled ${{ matrix.rippled-version }})
    strategy:
      fail-fast: false
      matrix:
        rippled-version: ["3.3.0", "3.2.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build goxrpl docker image
        run: docker build --build-arg "VERSION=${{ github.sha }}" -t goxrpl:latest .

      - name: Verify goxrpl image
        run: |
          set -euo pipefail
          output="$(docker run --rm goxrpl:latest version)"
          grep --fixed-strings --line-regexp "go-xrpl version ${{ github.sha }}" <<<"$output"
          grep --fixed-strings --line-regexp "Confidential MPT crypto: available" <<<"$output"

      - name: Run consensus smoke
        run: bash scripts/consensus-smoke/smoke.sh
        env:
          GOXRPL_IMAGE: goxrpl:latest
          RIPPLED_IMAGE: xrpllabsofficial/xrpld:${{ matrix.rippled-version }}
          PAYMENT_COUNT: "3"
          MIN_SEQ_EMPTY: "15"
          BOOT_TIMEOUT: "240"
          TX_TIMEOUT: "180"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f scripts/consensus-smoke/docker-compose.yml logs --no-color --tail=200 || true
      - name: Record producer evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-producer-consensus-smoke-${{ matrix.rippled-version }}
          EVIDENCE_LABEL: consensus-smoke-${{ matrix.rippled-version }}
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            docker build --build-arg VERSION=${{ github.sha }} -t goxrpl:latest .;
            GOXRPL_IMAGE=goxrpl:latest RIPPLED_IMAGE=xrpllabsofficial/xrpld:${{ matrix.rippled-version }} PAYMENT_COUNT=3 MIN_SEQ_EMPTY=15 BOOT_TIMEOUT=240 TX_TIMEOUT=180 bash scripts/consensus-smoke/smoke.sh
        run: scripts/acceptance/final-evidence.sh producer
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-consensus-smoke-${{ matrix.rippled-version }}
          path: ${{ runner.temp }}/issue-1908-producer-consensus-smoke-${{ matrix.rippled-version }}
          if-no-files-found: error

  consensus-smoke-final:
    name: Consensus smoke (rippled 3.4.0 final)
    runs-on: ubuntu-latest
    env:
      ORACLE_TAG: 3.4.0
      ORACLE_REPOSITORY: XRPLF/rippled
      ORACLE_COMMIT: 4a4fded2eba11427c48ce3f24d9c1aea5e7a9d17
      ORACLE_IMAGE: goxrpl-oracle:3.4.0
      GOXRPL_IMAGE: goxrpl-final:${{ github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-final-evidence
    steps:
      - name: Initialize final evidence directory
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"
      - uses: actions/checkout@v5

      - name: Record Go checkout provenance
        shell: bash
        run: scripts/acceptance/final-evidence.sh source

      - name: Check out final rippled oracle
        uses: actions/checkout@v5
        with:
          repository: XRPLF/rippled
          ref: 4a4fded2eba11427c48ce3f24d9c1aea5e7a9d17
          path: rippled-worktrees/v3.4.0-oracle

      - name: Capture final acceptance evidence and run checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_DIR"
          evidence="$EVIDENCE_DIR/evidence.txt"
          : > "$evidence"
          overall_status=0
          export ORACLE_TAG ORACLE_COMMIT ORACLE_IMAGE GOXRPL_IMAGE EVIDENCE_DIR

          run_recorded() {
            local label="$1"
            local command="$2"
            local rc
            printf '\nCOMMAND[%s]: %s\n' "$label" "$command" | tee -a "$evidence"
            bash -o pipefail -c "$command" 2>&1 | tee -a "$evidence"
            rc="${PIPESTATUS[0]}"
            printf 'STATUS[%s]: %s\n' "$label" "$rc" | tee -a "$evidence"
            if (( rc != 0 )); then
              overall_status=1
            fi
          }

          run_recorded tested_sha 'test "$(git rev-parse HEAD)" = "$GITHUB_SHA"'
          run_recorded go_worktree_clean 'test -z "$(git status --porcelain=v1 --untracked-files=all -- . ":(exclude)rippled-worktrees/v3.4.0-oracle")"'
          run_recorded oracle_checkout_sha 'test "$(git -C rippled-worktrees/v3.4.0-oracle rev-parse HEAD)" = "$ORACLE_COMMIT"'
          run_recorded oracle_checkout_clean 'test -z "$(git -C rippled-worktrees/v3.4.0-oracle status --porcelain)"'
          run_recorded tool_go_version 'go version'
          run_recorded tool_python_version 'python3 --version'
          run_recorded tool_bash_version 'bash --version | awk "NR == 1 {print}"'
          run_recorded tool_docker_version 'docker --version'
          run_recorded tool_compose_version 'docker compose version'
          run_recorded tool_jq_version 'jq --version'
          run_recorded definitions_regeneration 'python3 internal/rpc/testdata/server_definitions_final_oracle.py rippled-worktrees/v3.4.0-oracle --output "$EVIDENCE_DIR/server_definitions_final_hashes.json" && diff -u internal/rpc/testdata/server_definitions_final_hashes.json "$EVIDENCE_DIR/server_definitions_final_hashes.json"'
          run_recorded definition_fixture_metadata 'jq -c "{oracle,full_document_sha512_half,full_document_bytes}" internal/rpc/testdata/server_definitions_final_hashes.json'
          run_recorded definition_fixture_sha256 'sha256sum internal/rpc/testdata/server_definitions_final_hashes.json'
          run_recorded oracle_dockerfile_checksum 'grep -oE "sha256:[0-9a-f]{64}" scripts/peer-interop/Dockerfile'
          run_recorded oracle_build 'docker build -t "$ORACLE_IMAGE" scripts/peer-interop'
          run_recorded oracle_image_id 'docker image inspect "$ORACLE_IMAGE" --format "{{.Id}} {{json .RepoDigests}}"'
          run_recorded oracle_version 'docker run --rm --entrypoint /usr/bin/xrpld "$ORACLE_IMAGE" --version > "$EVIDENCE_DIR/oracle-version.txt"'
          run_recorded oracle_version_tag 'grep --fixed-strings --line-regexp "xrpld version $ORACLE_TAG" "$EVIDENCE_DIR/oracle-version.txt"'
          run_recorded oracle_version_commit 'grep --fixed-strings --line-regexp "Git commit hash: $ORACLE_COMMIT" "$EVIDENCE_DIR/oracle-version.txt"'
          run_recorded goxrpl_image_build 'docker build --build-arg "VERSION=$GITHUB_SHA" -t "$GOXRPL_IMAGE" .'
          run_recorded goxrpl_image_id 'docker image inspect "$GOXRPL_IMAGE" --format "{{.Id}} {{json .RepoDigests}}"'
          run_recorded goxrpl_version 'docker run --rm "$GOXRPL_IMAGE" version > "$EVIDENCE_DIR/goxrpl-version.txt" && grep --fixed-strings --line-regexp "go-xrpl version $GITHUB_SHA" "$EVIDENCE_DIR/goxrpl-version.txt"'
          run_recorded consensus_smoke 'GOXRPL_IMAGE="$GOXRPL_IMAGE" RIPPLED_IMAGE="$ORACLE_IMAGE" PAYMENT_COUNT=3 MIN_SEQ_EMPTY=15 BOOT_TIMEOUT=240 TX_TIMEOUT=180 bash scripts/consensus-smoke/smoke.sh > "$EVIDENCE_DIR/consensus-smoke.log" 2>&1'
          run_recorded consensus_smoke_log 'test -s "$EVIDENCE_DIR/consensus-smoke.log" && cat "$EVIDENCE_DIR/consensus-smoke.log"'

          go_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          dirty_status="$(git status --porcelain=v1 --untracked-files=all -- . ":(exclude)rippled-worktrees/v3.4.0-oracle")"
          if [[ -n "$dirty_status" ]]; then
            go_dirty=true
          else
            go_dirty=false
          fi
          definition_sha256="$(sha256sum internal/rpc/testdata/server_definitions_final_hashes.json 2>/dev/null | awk '{print $1}' || true)"
          definition_sha512_half="$(jq -r '.full_document_sha512_half // empty' internal/rpc/testdata/server_definitions_final_hashes.json 2>/dev/null || true)"
          oracle_image_id="$(docker image inspect "$ORACLE_IMAGE" --format '{{.Id}}' 2>/dev/null || true)"
          goxrpl_image_id="$(docker image inspect "$GOXRPL_IMAGE" --format '{{.Id}}' 2>/dev/null || true)"
          {
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf 'go_sha=%s\n' "$go_sha"
            printf 'go_dirty=%s\n' "$go_dirty"
            printf 'oracle_tag=%s\n' "$ORACLE_TAG"
            printf 'oracle_repository=%s\n' "$ORACLE_REPOSITORY"
            printf 'oracle_commit=%s\n' "$ORACLE_COMMIT"
            printf 'oracle_image=%s\n' "$ORACLE_IMAGE"
            printf 'consensus_oracle_image=%s\n' "$ORACLE_IMAGE"
            printf 'oracle_image_id=%s\n' "$oracle_image_id"
            printf 'goxrpl_image=%s\n' "$GOXRPL_IMAGE"
            printf 'goxrpl_image_id=%s\n' "$goxrpl_image_id"
            printf 'definition_sha256=%s\n' "$definition_sha256"
            printf 'definition_full_document_sha512_half=%s\n' "$definition_sha512_half"
            printf 'overall_status=%s\n' "$overall_status"
          } >> "$evidence"

          evidence_status=0
          for required in \
            "tested_sha=$GITHUB_SHA" \
            "go_sha=$GITHUB_SHA" \
            "go_dirty=false" \
            "oracle_tag=$ORACLE_TAG" \
            "oracle_repository=$ORACLE_REPOSITORY" \
            "oracle_commit=$ORACLE_COMMIT" \
            "consensus_oracle_image=$ORACLE_IMAGE" \
            "overall_status=0"; do
            if ! grep --fixed-strings --line-regexp "$required" "$evidence" >/dev/null; then
              printf 'MISSING_REQUIRED_EVIDENCE=%s\n' "$required" | tee -a "$evidence"
              evidence_status=1
            fi
          done
          for required_value in \
            "definition_sha256=$definition_sha256" \
            "definition_full_document_sha512_half=$definition_sha512_half" \
            "oracle_image_id=$oracle_image_id" \
            "goxrpl_image_id=$goxrpl_image_id"; do
            required_key="${required_value%%=*}"
            required_value="${required_value#*=}"
            if [[ -z "$required_value" ]]; then
              printf 'MISSING_REQUIRED_EVIDENCE=%s\n' "$required_key" | tee -a "$evidence"
              evidence_status=1
            fi
          done
          printf 'evidence_validation_status=%s\n' "$evidence_status" | tee -a "$evidence"
          if (( evidence_status != 0 || overall_status != 0 )); then
            exit 1
          fi

      - name: Record final consensus producer evidence
        if: always()
        env:
          EVIDENCE_LABEL: consensus-smoke-final
          EVIDENCE_STATUS: ${{ job.status }}
          EVIDENCE_COMMAND: >-
            python3 internal/rpc/testdata/server_definitions_final_oracle.py
            rippled-worktrees/v3.4.0-oracle;
            docker build -t "$ORACLE_IMAGE" scripts/peer-interop;
            docker build --build-arg VERSION="$GITHUB_SHA" -t "$GOXRPL_IMAGE" .;
            GOXRPL_IMAGE="$GOXRPL_IMAGE" RIPPLED_IMAGE="$ORACLE_IMAGE" PAYMENT_COUNT=3 MIN_SEQ_EMPTY=15 BOOT_TIMEOUT=240 TX_TIMEOUT=180 bash scripts/consensus-smoke/smoke.sh
        run: scripts/acceptance/final-evidence.sh producer

      - name: Upload final consensus producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-producer-${{ github.sha }}-consensus-smoke-final
          path: ${{ runner.temp }}/issue-1908-final-evidence
          if-no-files-found: error

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-final-consensus-${{ github.sha }}
          path: ${{ runner.temp }}/issue-1908-final-evidence
          if-no-files-found: error

      - name: Dump final consensus logs on failure
        if: failure()
        run: docker compose -f scripts/consensus-smoke/docker-compose.yml logs --no-color --tail=200 || true

  acceptance-evidence:
    name: Acceptance evidence (final SHA)
    if: always()
    needs:
      - lint
      - lint-advisory
      - generate
      - build
      - build-386
      - postgres
      - test
      - test-purego
      - test-mpt-crypto
      - peer-interop
      - peer-interop-final
      - consensus-smoke
      - consensus-smoke-final
      - test-repeated
      - conformance-final
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: ${{ runner.temp }}/issue-1908-final-acceptance
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Initialize final evidence directory
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR/producers"

      - uses: actions/checkout@v5
        if: always()

      - name: Download producer evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: issue-1908-producer-${{ github.sha }}-*
          path: ${{ runner.temp }}/issue-1908-final-acceptance/producers
          merge-multiple: true

      - name: Record producer job results
        if: always()
        shell: bash
        run: |
          {
            printf 'lint=%s\n' "${{ needs.lint.result }}"
            printf 'lint-advisory=%s\n' "${{ needs['lint-advisory'].result }}"
            printf 'generate=%s\n' "${{ needs.generate.result }}"
            printf 'build=%s\n' "${{ needs.build.result }}"
            printf 'build-386=%s\n' "${{ needs['build-386'].result }}"
            printf 'postgres=%s\n' "${{ needs.postgres.result }}"
            printf 'test=%s\n' "${{ needs.test.result }}"
            printf 'test-purego=%s\n' "${{ needs['test-purego'].result }}"
            printf 'test-mpt-crypto=%s\n' "${{ needs['test-mpt-crypto'].result }}"
            printf 'peer-interop=%s\n' "${{ needs['peer-interop'].result }}"
            printf 'peer-interop-final=%s\n' "${{ needs['peer-interop-final'].result }}"
            printf 'consensus-smoke=%s\n' "${{ needs['consensus-smoke'].result }}"
            printf 'consensus-smoke-final=%s\n' "${{ needs['consensus-smoke-final'].result }}"
            printf 'test-repeated=%s\n' "${{ needs['test-repeated'].result }}"
            printf 'conformance-final=%s\n' "${{ needs['conformance-final'].result }}"
          } > "$EVIDENCE_DIR/needs-results.txt"

      - name: Record exact workflow commands
        if: always()
        shell: bash
        run: |
          cat > "$EVIDENCE_DIR/workflow-commands.txt" <<'EOF'
          lint: golangci/golangci-lint-action@v8 version=v2.11.3; go vet -tags postgres ./storage/relationaldb/postgres/
          lint-advisory: golangci/golangci-lint-action@v8 version=v2.11.3 args=--config .golangci-warnings.yml (non-blocking)
          generate: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11; go generate ./ledger/entry/... ./internal/peermanagement/proto; git diff --exit-code -- ledger/entry internal/peermanagement/proto/xrpl.pb.go
          build: ./scripts/build.sh; ../tmp/goxrpl version
          build-386: GOOS=linux GOARCH=386 CGO_ENABLED=0 go build ./...; GOOS=linux GOARCH=386 CGO_ENABLED=0 go test -count=1 -timeout 5m ./storage/relationaldb/sqlite/...
          postgres: go test -race -tags postgres -count=1 -timeout 10m ./storage/relationaldb/postgres/...
          test: go test <matrix.race> -count=1 -timeout 15m <matrix.packages> (one producer artifact per matrix group)
          test-purego: CGO_ENABLED=0 go test -count=1 -timeout 15m ./crypto/...; CGO_ENABLED=0 go test -tags mptcrypto -count=1 -timeout 15m ./amendment/... ./crypto/mptcrypto/...
          test-mpt-crypto: ./scripts/setup-mpt-crypto.sh test ./amendment/... ./crypto/mptcrypto/... ./internal/tx/mpt/... ./internal/testing/mpt/... (one producer artifact per OS)
          test-repeated: go test -count=2 -timeout 20m ./codec/binarycodec/definitions ./ledger/entry/schema ./ledger/entry ./internal/rpc
          peer-interop: PEERTLS_DOCKER_INTEROP=1 go test -tags docker -timeout 5m -v -run Test(Handshake|Manifest)_Interop_RippledDocker ./internal/peermanagement/
          peer-interop-final: docker build -t goxrpl-oracle:3.4.0 scripts/peer-interop; verify xrpld tag/commit; go test -race -tags docker -count=1 -timeout 10m -v -run Test(Handshake|Manifest|LedgerNodeDepth|ValidatorListCollection)_Interop_RippledDocker ./internal/peermanagement/
          consensus-smoke: docker build goxrpl; bash scripts/consensus-smoke/smoke.sh against official rippled 3.3.0 and 3.2.0 (one producer artifact per version)
          consensus-smoke-final: regenerate definitions; build/check final rippled 3.4.0 and Go images; bash scripts/consensus-smoke/smoke.sh
          conformance-final: actions/checkout@v5 at XRPL_FINAL_CONFORMANCE_COMMIT into fixtures/rippled-3.4.0-v3; GOXRPL_FIXTURES_DIR=FINAL_CONFORMANCE_CORPUS GOXRPL_CONFORMANCE_REQUIRED=1 go test -count=1 -timeout 30m -v ./internal/testing/conformance/... (requires pinned corpus manifest)
          EOF

      - name: Aggregate and validate final evidence
        if: always()
        shell: bash
        run: scripts/acceptance/final-evidence.sh aggregate

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1908-final-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/issue-1908-final-acceptance
          if-no-files-found: error
