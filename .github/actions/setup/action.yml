name: "Setup Go + native toolchain"
description: >
  Sets up Go (version pinned via go.mod's go/toolchain directives) with build
  caching, and installs the native headers (OpenSSL, libsecp256k1) used by the
  peer TLS and secp256k1 shims. Cross-platform (apt on Linux, brew on macOS).
  Centralizes the setup every CI job repeats so the Go version and dependency
  list live in one place.

inputs:
  cgo:
    description: "Enable CGO and install native headers (OpenSSL + libsecp256k1)."
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure CGO
      shell: bash
      run: echo "CGO_ENABLED=${{ inputs.cgo == 'true' && '1' || '0' }}" >> "$GITHUB_ENV"

    - name: Install CGO dev headers (Linux)
      if: inputs.cgo == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libssl-dev libsecp256k1-dev pkg-config

    - name: Install CGO dev headers (macOS)
      if: inputs.cgo == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install openssl@3 secp256k1 pkg-config
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix secp256k1)/lib/pkgconfig" >> "$GITHUB_ENV"

    - name: Verify native pkg-config metadata
      if: inputs.cgo == 'true'
      shell: bash
      run: |
        pkg-config --exists libssl libcrypto libsecp256k1
        printf 'OpenSSL %s; libsecp256k1 %s\n' \
          "$(pkg-config --modversion libssl)" \
          "$(pkg-config --modversion libsecp256k1)"

    # go-version-file reads the `go` directive from go.mod; the `toolchain`
    # directive (go1.24.4) then pins the exact compiler the `go` command uses at
    # build time via GOTOOLCHAIN=auto. One source of truth, no floating "1.24".
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true
