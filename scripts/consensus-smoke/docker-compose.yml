name: goxrpl-consensus-smoke

# 2 rippled + 1 goxrpl, all three validators in the shared UNL. Quorum = 3
# (ceil(0.8 * 3)), so every node must validate the same ledger for the
# network to advance. This is the regression gate for cross-implementation
# consensus and tx-execution determinism.

services:
  rippled-0:
    image: ${RIPPLED_IMAGE:-xrpllabsofficial/xrpld:3.3.0}
    hostname: rippled-0
    ports:
      - "5005"
      - "6006"
    volumes:
      - ./configs/rippled-0.cfg:/config/xrpld.cfg:ro
      - ./configs/validators.txt:/config/validators.txt:ro
      # The checksum-pinned final oracle image starts xrpld with its package
      # config path; official images use /config. Keep both contracts mounted
      # so RIPPLED_IMAGE can switch without changing the topology.
      - ./configs/rippled-0.cfg:/etc/xrpld/xrpld.cfg:ro
      - ./configs/validators.txt:/etc/xrpld/validators.txt:ro
      - ./xrpld-healthcheck.sh:/usr/local/bin/xrpld-healthcheck.sh:ro
    networks: [smoke]
    healthcheck:
      test: ["CMD-SHELL", "bash /usr/local/bin/xrpld-healthcheck.sh"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  rippled-1:
    image: ${RIPPLED_IMAGE:-xrpllabsofficial/xrpld:3.3.0}
    hostname: rippled-1
    ports:
      - "5005"
      - "6006"
    volumes:
      - ./configs/rippled-1.cfg:/config/xrpld.cfg:ro
      - ./configs/validators.txt:/config/validators.txt:ro
      - ./configs/rippled-1.cfg:/etc/xrpld/xrpld.cfg:ro
      - ./configs/validators.txt:/etc/xrpld/validators.txt:ro
      - ./xrpld-healthcheck.sh:/usr/local/bin/xrpld-healthcheck.sh:ro
    networks: [smoke]
    healthcheck:
      test: ["CMD-SHELL", "bash /usr/local/bin/xrpld-healthcheck.sh"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  goxrpl-0:
    image: ${GOXRPL_IMAGE:-goxrpl:latest}
    hostname: goxrpl-0
    ports:
      - "5005"
      - "6006"
    volumes:
      - ./configs:/etc/goxrpl:ro
    command: ["server", "--conf", "/etc/goxrpl/goxrpl-0.toml"]
    networks: [smoke]
    depends_on:
      rippled-0:
        condition: service_healthy
      rippled-1:
        condition: service_healthy

networks:
  smoke:
    driver: bridge
